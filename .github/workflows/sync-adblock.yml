name: sync-adblock

on:
  schedule:
    # UTC 21:00 = 北京时间 05:00（晚于另外两条链，避免并发推送）
    - cron: '0 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-adblock.mjs'
      - '.github/workflows/sync-adblock.yml'

permissions:
  contents: write

concurrency:
  group: sync-adblock
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 拉取上游模块并剔除金融段
        run: node scripts/build-adblock.mjs

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adblock/blockAds.srmodule
          if git diff --cached --quiet; then
            echo "上游无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: sync adblock module $(date -u +%Y-%m-%d)"
          git push
