name: sync-bettbox

on:
  schedule:
    # UTC 20:00 = 北京时间 04:00
    - cron: '0 20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-bettbox.mjs'
      - 'scripts/validate-configs.mjs'
      - 'bettbox/rules-extra.txt'
      - 'bettbox/custom-proxies.mjs'
      - '.github/workflows/sync-bettbox.yml'

permissions:
  contents: write

concurrency:
  group: sync-bettbox
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 拉取上游并打补丁
        env:
          # 仅用于查询上游 commit 版本号（构建指纹），未认证会受 60 次/小时限流
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-bettbox.mjs

      - name: 校验配置与规则顺序
        run: node scripts/validate-configs.mjs

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bettbox/mihomoScript.js
          if git diff --cached --quiet; then
            echo "上游无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: sync bettbox script $(date -u +%Y-%m-%d)"
          git push
