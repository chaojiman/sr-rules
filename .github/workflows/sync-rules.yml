name: sync-rules

on:
  schedule:
    # UTC 19:00 = 北京时间 03:00
    - cron: '0 19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build-rules.mjs'
      - '.github/workflows/sync-rules.yml'

permissions:
  contents: write

concurrency:
  group: sync-rules
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成规则集
        run: node build-rules.mjs

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules
          if git diff --cached --quiet; then
            echo "上游无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: sync rules $(date -u +%Y-%m-%d)

          Co-Authored-By: Claude Code <noreply@anthropic.com>"
          git push
