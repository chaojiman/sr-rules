DOMAIN-SET,https://raw.githubusercontent.com/chaojiman/sr-rules/main/shadowrocket/rules/china.list,DIRECT

# ===== 9. 金融直连（必须在 global 之前）=====
# 香港银行/券商走代理会让银行看到海外机房 IP，触发风控/二次验证。
# 加密交易所（binance/okx）和美国券商（IBKR/Schwab）不在此列，仍走代理。
DOMAIN-SET,https://raw.githubusercontent.com/chaojiman/sr-rules/main/shadowrocket/rules/finance.list,DIRECT

# ===== 10. 兜底 =====
DOMAIN-SET,https://raw.githubusercontent.com/chaojiman/sr-rules/main/shadowrocket/rules/private.list,DIRECT
# 境外已知域名，必须在 IP 规则之前：
# 命中即确定走代理，不再触发本地 DNS 解析，绕开国内 DoH 的污染/拒绝服务
# （实测阿里 DoH 对 okx 返回 169.254.0.2，google/coinbase 返回 Facebook 的 IP 段）
DOMAIN-SET,https://raw.githubusercontent.com/chaojiman/sr-rules/main/shadowrocket/rules/global.list,PROXY
# cn-ip.list（9,662 条 IP-CIDR）已删除：它和下面的 GEOIP,CN 是同一份 cn geoip 数据，
# 留着等于用「线性扫描 9,662 条 CIDR」把内置库查询重做一遍。GEOIP 走 MMDB 二分查找，快得多。
RULE-SET,https://raw.githubusercontent.com/chaojiman/sr-rules/main/shadowrocket/rules/private-ip.list,DIRECT
# 不加 no-resolve：加了会让 GEOIP 对所有域名请求直接跳过，国内 IP 兜底失效
GEOIP,CN,DIRECT
FINAL,漏网之鱼

