localhost = 127.0.0.1

[MITM]
enable = true
# 已开启：App 内开屏去广告（菜鸟/京东/小红书等）依赖 MITM 解密才能生效。
# 前置条件：装完整版 blockAds.srmodule（-dns 版无 MITM 段，装了也不起作用），
# 且已安装并信任小火箭 CA 证书。
# 金融负向排除：证书固定（Certificate Pinning）的 App 被 MITM 后会直接报错或闪退。
# 前缀 `-` = 排除，不解密这些域名。
hostname = -*.xueqiu.com, -*.10jqka.com.cn, -*.eastmoney.com
#
# 如需启用 App 内去开屏：
# 1. 小火箭 → 配置 ⓘ → HTTPS 解密 → 证书 → 生成新的 CA 证书 → 安装证书
# 2. iOS 设置 → 已下载描述文件 → 安装
# 3. iOS 设置 → 通用 → 关于本机 → 证书信任设置 → 打开小火箭开关
# 4. 安装 adblock/blockAds.srmodule（完整版，不是 -dns 版）（会变卡）
#
# 出问题怎么办：
# - 整体不对劲 → enable 改回 false，立即恢复原状
# - 银行域名不在正向列表里，构建时已剔除，理论上不会被解密
