# ===== 地区（全部手动，选谁就是谁） =====
香港节点 = select,policy-regex-filter=^(?!.*x0\.)(?:🇭🇰|HK|Hong|hong|香港|深港|沪港|京港)
日本节点 = select,policy-regex-filter=^(?!.*x0\.)(?:🇯🇵|JP|Japan|japan|Tokyo|tokyo|日本|东京|大阪|京日|苏日|沪日|上日|川日|深日|广日)
美国节点 = select,policy-regex-filter=^(?!.*x0\.)(?:🇺🇸|(?<![A-Za-z])USA?(?![A-Za-z])|America|america|United States|美国|凤凰城|洛杉矶|西雅图|芝加哥|纽约|沪美)
台湾节点 = select,policy-regex-filter=^(?!.*x0\.)(?:🇹🇼|TW|TWN|Taiwan|Taipei|taiwan|台湾|台灣|台北|台中|新北|彰化)
新加坡节点 = select,policy-regex-filter=^(?!.*x0\.)(?:🇸🇬|SG|Sing|sing|新加坡|狮城|沪新|京新|深新|杭新|广新)

# ===== 地区（自动，url-test）=====
# 节点挂了会自动跳过；按握手延迟排序，不代表带宽最优 —— 追求性能请用手动组钉死
# 已排除低倍率节点（名字含 x0. 一律不进组）
香港-自动 = url-test,policy-regex-filter=^(?!.*x0\.)(?:🇭🇰|HK|Hong|hong|香港|深港|沪港|京港),url=https://www.gstatic.com/generate_204,interval=900,tolerance=50
日本-自动 = url-test,policy-regex-filter=^(?!.*x0\.)(?:🇯🇵|JP|Japan|japan|Tokyo|tokyo|日本|东京|大阪|京日|苏日|沪日|上日|川日|深日|广日),url=https://www.gstatic.com/generate_204,interval=900,tolerance=50
美国-自动 = url-test,policy-regex-filter=^(?!.*x0\.)(?:🇺🇸|(?<![A-Za-z])USA?(?![A-Za-z])|America|america|United States|美国|凤凰城|洛杉矶|西雅图|芝加哥|纽约|沪美),url=https://www.gstatic.com/generate_204,interval=900,tolerance=50
台湾-自动 = url-test,policy-regex-filter=^(?!.*x0\.)(?:🇹🇼|TW|TWN|Taiwan|Taipei|taiwan|台湾|台灣|台北|台中|新北|彰化),url=https://www.gstatic.com/generate_204,interval=900,tolerance=50
新加坡-自动 = url-test,policy-regex-filter=^(?!.*x0\.)(?:🇸🇬|SG|Sing|sing|新加坡|狮城|沪新|京新|深新|杭新|广新),url=https://www.gstatic.com/generate_204,interval=900,tolerance=50

# ===== 兜底 =====
# ⚠️ 这是所有「没被上面规则命中」的域名的总出口，必须保持 PROXY
#    改成 DIRECT 会让全部境外站点直连（CloudFront / AWS / 大部分海外服务直接不可用）
漏网之鱼 = select,PROXY,香港节点,香港-自动,台湾节点,台湾-自动,日本节点,日本-自动,新加坡节点,新加坡-自动,美国节点,美国-自动,policy-select-name=PROXY

# ===== 去广告总开关 =====
