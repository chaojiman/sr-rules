*.mcdn.bilivideo.cn = 0.0.0.0
*.edge.mountaintoys.cn = 0.0.0.0
*.h2.smtcdns.net = 0.0.0.0

[URL Rewrite]
# 酷狗 / 酷狗概念版 开屏与广告接口（模块只做了 DNS 层，拦不到主域接口）
^https?:\/\/ads?\.?s?ervice(retry)?\.(kugou|kglink)\.(com|cn)\/v\d\/ - reject-200
^https?:\/\/splashimgbssdl\.yun\.kugou\.com\/ - reject-200
^https?:\/\/adsfile\.bssdlbig\.kugou\.com\/ - reject-200

[MITM]
enable = true
# ══════════════════════════════════════════════════════════
# 去广告模块（adblock/blockAds.srmodule）会 %APPEND% 自己的 hostname
# 这里只放「保险丝」：负向排除金融域名，任何模块都无法解密它们
# ══════════════════════════════════════════════════════════
hostname = -*.ccb.com,-*.icbc.com.cn,-*.abchina.com,-*.abchina.com.cn,-*.boc.cn,-*.bankofchina.com,-*.cmbchina.com,-*.psbc.com,-*.bankcomm.com,-*.bankcomm.cn,-*.spdb.com.cn,-*.citicbank.com,-*.cmbc.com.cn,-*.hxb.com.cn,-*.cebbank.com,-*.bankofbeijing.com.cn,-*.jsbchina.cn,-*.jlbank.com.cn,-*.cgbchina.com.cn,-*.cib.com.cn,-*.95516.com,-*.unionpay.com,-*.unionpaysecure.com,-*.alipay.com,-*.alipayobjects.com,-*.tenpay.com,-*.tenpay.com.cn,-*.paas.cmbchina.com,ads.service.kugou.com,adserviceretry.kugou.com,splashimgbssdl.yun.kugou.com,adsfile.bssdlbig.kugou.com,page.hongyibo.com.cn,res-new.hongyibo.com.cn,conf.hongyibo.com.cn
#
# 启用步骤（只需做一次）：
# 1. 小火箭 → 配置 ⓘ → HTTPS 解密 → 证书 → 生成新的 CA 证书 → 安装证书
# 2. iOS 设置 → 已下载描述文件 → 安装
# 3. iOS 设置 → 通用 → 关于本机 → 证书信任设置 → 打开 Shadowrocket 开关
#
# 出问题怎么办：
# - 某个 App 异常 → 上面 hostname 行加 -该域名
# - 整体不对劲 → enable 改回 false，立即恢复原状
# - 银行永远不在正向列表里，负向排除是双保险，理论上不会碰到
