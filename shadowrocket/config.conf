广告拦截 = select,REJECT,DIRECT,policy-select-name=REJECT

[Rule]
# ===== 0. Tailscale 内网（必须在最前）=====
# 100.64.0.0/10        Tailscale IPv4 地址段
# fd7a:115c:a1e0::/48  Tailscale IPv6 ULA 段
# ts.net               MagicDNS 后缀
# TAILSCALE 是小火箭内置策略（Tailscale 出口），不是自定义名称；
#    需先在「设置 → Tailscale」填认证密钥并启用，否则规则无出口
# ⚠️ 不要把 100.64.0.0/10 写进 tun-excluded-routes，会让 tailnet 流量绕过 Tailscale
# ⚠️ 访问用 100.x IP 或完整 xxx.ts.net 域名；短主机名（如 nas）匹配不到本规则
# 不要再同时开官方 Tailscale App：iOS 同时只能有一个 VPN
IP-CIDR,100.64.0.0/10,TAILSCALE,no-resolve
IP-CIDR6,fd7a:115c:a1e0::/48,TAILSCALE,no-resolve
DOMAIN-SUFFIX,ts.net,TAILSCALE

# ===== 0.4 B 站 PCDN 秒拒（原 [Host] 0.0.0.0 方案压不住 AAAA/HTTPS 记录，规则层通杀）=====
DOMAIN-SUFFIX,mcdn.bilivideo.com,REJECT
DOMAIN-SUFFIX,mcdn.bilivideo.cn,REJECT
DOMAIN-SUFFIX,edge.mountaintoys.cn,REJECT
DOMAIN-SUFFIX,h2.smtcdns.net,REJECT
DOMAIN-SUFFIX,szbdyd.com,REJECT

# ===== 0.5 例外（必须在广告之前）=====
# X/Twitter：ads.list 里有 8 条 Twitter 子域被 REJECT，
# 其中 syndication / urls.api / scribe / p 并非纯广告，会导致 X App
# 启动和刷评论时请求失败重试。必须写在广告 DOMAIN-SET 之前，否则命中即停。
DOMAIN-SET,https://raw.githubusercontent.com/chaojiman/sr-rules/main/shadowrocket/rules/twitter.list,PROXY

# ===== 1. 广告拦截（零 MITM）=====
# ADLite 已转为本地 DOMAIN-SET（原 RULE-SET 53,068 条逐条匹配 → 域名集合），
# 由 build-shadowrocket.mjs 每天从 yfamilys.com 拉取并转换
DOMAIN-SET,https://raw.githubusercontent.com/chaojiman/sr-rules/main/shadowrocket/rules/adlite.list,广告拦截
DOMAIN-SET,https://raw.githubusercontent.com/chaojiman/sr-rules/main/shadowrocket/rules/ads.list,广告拦截
# 原 blockAds-dns.srmodule 里无法用域名表达的部分：广告 SDK 关键词、AND 逻辑、广告 IP
# （域名部分已并进 ads.list）
RULE-SET,https://raw.githubusercontent.com/chaojiman/sr-rules/main/shadowrocket/rules/ads-pattern.list,广告拦截

# ===== 1.5 显式优先（覆盖规则集内的重复条目，顺序不可调）=====
# 被国内拦的站点：国内 DNS 给联通山东 IP 且不可达，境外解析走香港 CDN（实测 200）。
# 必须早于第 8 节的 DOMAIN-SUFFIX,cn,DIRECT，否则会先被直连截胡。
DOMAIN-SUFFIX,16688.com.cn,PROXY
# 抖音/头条全系直连：tiktok.list / douyin.list 里已无 snssdk，
# 不写这条会落到 global.list → 漏网之鱼 → 代理
DOMAIN-SUFFIX,snssdk.com,DIRECT

# OKX：阿里 DoH 对中国区返回 169.254.0.2（链路本地，不可路由），
# 且该地址在 tun-excluded-routes 里，请求会在系统层直接失败。
# 加显式域名规则跳过 GEOIP 的本地解析，交给代理端远端解析。
DOMAIN-SUFFIX,okx.com,漏网之鱼

# ===== 2. GitHub / AI（顺序不可调：GitHub 在 AI 前，Copilot 才归 PROXY；AI 在谷歌前，antigravity 才归 AI）=====
DOMAIN-SET,https://raw.githubusercontent.com/chaojiman/sr-rules/main/shadowrocket/rules/github.list,PROXY
DOMAIN-SET,https://raw.githubusercontent.com/chaojiman/sr-rules/main/shadowrocket/rules/ai.list,AI
RULE-SET,https://raw.githubusercontent.com/chaojiman/sr-rules/main/shadowrocket/rules/ai-extra.list,AI

# ===== 3. 流媒体 =====
# Netflix / Disney+ / Max / Spotify 已无独立分组，由 global.list → PROXY 接住
DOMAIN-SET,https://raw.githubusercontent.com/chaojiman/sr-rules/main/shadowrocket/rules/youtube.list,YouTube

# ===== 4. 社交 =====
DOMAIN-SET,https://raw.githubusercontent.com/chaojiman/sr-rules/main/shadowrocket/rules/telegram.list,Telegram
# MTProto 会直接连 IP，只有域名规则时这些连接会落到漏网之鱼，不跟随 Telegram 分组
